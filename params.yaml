# Subset sizes keep a full run within a single Colab T4 session.
data:
  train_samples: 4000
  validation_samples: 300
  test_samples: 200
  max_input_length: 1024
  max_target_length: 256

# Passed straight through to transformers.Seq2SeqTrainingArguments.
# Mixed precision is chosen at runtime: bf16 where the GPU supports it, otherwise fp32
# (Pegasus is numerically unstable in fp16).
TrainingArguments:
  num_train_epochs: 1
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1
  gradient_accumulation_steps: 16
  gradient_checkpointing: true
  optim: adafactor
  learning_rate: 5.0e-5
  warmup_steps: 50
  weight_decay: 0.01
  eval_strategy: epoch
  save_strategy: epoch
  save_total_limit: 1
  logging_steps: 20
  load_best_model_at_end: true
  metric_for_best_model: eval_loss
  report_to: none

generation:
  num_beams: 4
  max_new_tokens: 256
  length_penalty: 0.8

evaluation:
  num_samples: 200
  batch_size: 4
