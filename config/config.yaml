artifacts_root: artifacts

data_ingestion:
  root_dir: artifacts/data_ingestion
  dataset_name: ccdv/arxiv-summarization
  dataset_config: section
  save_dir: artifacts/data_ingestion/arxiv

data_transformation:
  root_dir: artifacts/data_transformation
  data_path: artifacts/data_ingestion/arxiv
  tokenizer_name: google/pegasus-cnn_dailymail
  save_dir: artifacts/data_transformation/arxiv_tokenized

model_trainer:
  root_dir: artifacts/model_trainer
  data_path: artifacts/data_transformation/arxiv_tokenized
  model_ckpt: google/pegasus-cnn_dailymail
  model_dir: artifacts/model_trainer/pegasus-arxiv

model_evaluation:
  root_dir: artifacts/model_evaluation
  data_path: artifacts/data_ingestion/arxiv
  base_model: google/pegasus-cnn_dailymail
  model_path: artifacts/model_trainer/pegasus-arxiv
  metric_file_name: artifacts/model_evaluation/metrics.json
